name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:

  public-contracts:
    name: Public Contracts & SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate contract JSON
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = [
            'core/twin-core/contracts/schema/public/v1',
            'core/twin-core/contracts/schema/public/v1/fixtures',
          ];
          for (const root of roots) {
            for (const file of fs.readdirSync(root).filter((name) => name.endsWith('.json'))) {
              JSON.parse(fs.readFileSync(path.join(root, file), 'utf8'));
            }
          }
          JSON.parse(fs.readFileSync('core/twin-core/contracts/schema/manifest.schema.json', 'utf8'));
          console.log('JSON CONTRACT FILES PASS');
          NODE

      - name: Run contract fixtures
        run: node core/twin-core/contracts/tests/run-contract-tests.mjs

      - name: Build TypeScript SDK
        run: |
          npx --yes -p typescript@5.7.2 tsc --project packages/twin-ui-sdk/tsconfig.json

      - name: Validate SDK release metadata
        run: node bin/validate-sdk-release.mjs --check-build

      - name: Validate plugin contract registry
        run: node bin/validate-plugin-contract-registry.mjs

      - name: Reject new active contract bypasses
        run: node bin/framework-contract-audit.mjs

  plugin-diagnostics:
    name: Per-plugin Diagnostics Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: json, mbstring, curl

      - name: Run reference and broken diagnostics fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/plugin-diagnostics

          php bin/twin diagnostics plugin examples/bizcity-reference-plugin --json > build/plugin-diagnostics/reference.json
          php -r '
            $data = json_decode( file_get_contents( $argv[1] ), true );
            if ( ! is_array( $data ) || "bizcity.twin.diagnostics-verdict" !== ( $data["contract"] ?? "" ) ) {
              fwrite( STDERR, "Reference diagnostics did not produce diagnostics-verdict v1.\n" );
              exit( 1 );
            }
            $smoke = array_values( array_filter( $data["checks"], function ( $check ) {
              return "smoke_test" === ( $check["id"] ?? "" );
            } ) );
            if ( "skip" !== ( $smoke[0]["status"] ?? "" ) ) {
              fwrite( STDERR, "Reference smoke check must be SKIP without WordPress runtime.\n" );
              exit( 1 );
            }
          ' build/plugin-diagnostics/reference.json

          set +e
          php bin/twin diagnostics plugin tests/fixtures/plugin-diagnostics/broken-plugin --json > build/plugin-diagnostics/broken.json
          broken_exit=$?
          set -e
          if [ "$broken_exit" -ne 1 ]; then
            echo "Broken fixture must exit 1, got $broken_exit."
            exit 1
          fi
          php -r '
            $data = json_decode( file_get_contents( $argv[1] ), true );
            if ( ! is_array( $data ) || "fail" !== ( $data["verdict"] ?? "" ) || 1 !== (int) ( $data["exit_code"] ?? -1 ) ) {
              fwrite( STDERR, "Broken fixture did not produce a fail verdict.\n" );
              exit( 1 );
            }
          ' build/plugin-diagnostics/broken.json

      - name: Discover changed plugin directories
        id: changed-plugins
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-list --max-count=2 "$HEAD_SHA" | tail -n 1)
          fi
          git diff --name-only "$base" "$HEAD_SHA" -- 'plugins/**' \
            | awk -F/ 'NF >= 2 && $2 != "_archived" { print "plugins/" $2 }' \
            | sort -u > build/plugin-diagnostics/changed.txt
          printf 'paths<<EOF\n%s\nEOF\n' "$(tr '\n' ' ' < build/plugin-diagnostics/changed.txt)" >> "$GITHUB_OUTPUT"

      - name: Run diagnostics for changed plugins
        shell: bash
        env:
          CHANGED_PLUGINS: ${{ steps.changed-plugins.outputs.paths }}
        run: |
          set -euo pipefail
          summary="${GITHUB_STEP_SUMMARY}"
          {
            echo "## Per-plugin Diagnostics"
            echo ""
            echo "Static contract checks use diagnostics-verdict v1. Smoke is SKIP without WordPress runtime."
            echo ""
            echo "| Plugin | Check | Status | Evidence |"
            echo "|---|---|---|---|"
          } >> "$summary"

          if [ -z "${CHANGED_PLUGINS// /}" ]; then
            echo "No active plugins changed in this revision." >> "$summary"
            exit 0
          fi

          status=0
          for plugin in $CHANGED_PLUGINS; do
            if [ ! -d "$plugin" ]; then
              continue
            fi
            slug=$(basename "$plugin")
            result="build/plugin-diagnostics/${slug}.json"
            set +e
            php bin/twin diagnostics plugin "$plugin" --json > "$result"
            exit_code=$?
            set -e
            php -r '
              $data = json_decode( file_get_contents( $argv[1] ), true );
              if ( ! is_array( $data ) || ! isset( $data["checks"] ) ) { exit( 1 ); }
              foreach ( $data["checks"] as $check ) {
                printf( "| %s | %s | %s | %s |\\n", $argv[2], $check["label"], strtoupper( $check["status"] ), str_replace( "|", "\\|", $check["evidence"] ) );
              }
            ' "$result" "$slug" >> "$summary"
            if [ "$exit_code" -ne 0 ]; then
              status=1
            fi
          done
          exit "$status"

  lint-php:
    name: PHP Lint & Compat
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, curl
          tools: composer:v2, phpcs

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: PHP syntax check
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            if ! output=$(php -l "$file" 2>&1); then
              printf '%s\n' "$output"
              status=1
            fi
          done < <(
            find core modules plugins includes mu-plugin bin \
              -type f -name '*.php' \
              ! -path '*/_archived/*' \
              -print0
          )
          exit "$status"

      - name: Validate reference extension manifest
        run: php bin/bizcity-manifest-validate.php --plugin=examples/bizcity-reference-plugin

      - name: PHP 7.4 compatibility grep guards
        run: |
          set -e
          # Union return type
          if grep -rn --include='*.php' -E '\):\s*[A-Za-z_]+\|[A-Za-z_]+' core modules plugins includes; then
            echo "::error::Union return type detected (PHP 8.0+ only). PHP 7.4 floor violation."
            exit 1
          fi
          # Nullsafe
          if grep -rn --include='*.php' -E '\?->[a-zA-Z_]' core modules plugins includes; then
            echo "::error::Nullsafe operator ?-> detected (PHP 8.0+ only)."
            exit 1
          fi
          # match expression — use PHP tokens so method calls, JavaScript, SQL,
          # and comments containing "match(" are not treated as PHP match expressions.
          match_status=0
          while IFS= read -r -d '' file; do
            if ! php -r '
              $file = $argv[1];
              $tokens = token_get_all( file_get_contents( $file ) );
              $ignored = array( T_WHITESPACE, T_COMMENT, T_DOC_COMMENT );
              for ( $i = 0, $n = count( $tokens ); $i < $n; $i++ ) {
                $token = $tokens[ $i ];
                if ( ! is_array( $token ) || ! defined( "T_MATCH" ) || T_MATCH !== $token[0] ) { continue; }
                $previous = null;
                for ( $j = $i - 1; $j >= 0; $j-- ) {
                  if ( is_array( $tokens[ $j ] ) && in_array( $tokens[ $j ][0], $ignored, true ) ) { continue; }
                  $previous = is_array( $tokens[ $j ] ) ? $tokens[ $j ][0] : $tokens[ $j ];
                  break;
                }
                if ( $previous === T_OBJECT_OPERATOR || $previous === T_DOUBLE_COLON || $previous === T_FUNCTION ) { continue; }
                printf( "%s:%d: match expression token detected\n", $file, $token[2] );
                exit( 1 );
              }
            ' "$file"; then
              match_status=1
            fi
          done < <(
            find core modules plugins includes \
              -type f -name '*.php' \
              ! -path '*/_archived/*' \
              ! -path '*/_library/*' \
              -print0
          )
          if [ "$match_status" -ne 0 ]; then
            echo "::error::PHP match expression detected (PHP 8.0+ only)."
            exit 1
          fi
          # str_* family — the plugin loads includes/compat-php74.php before
          # module bootstraps, so these calls are safe on PHP 7.4. Fail only if
          # the canonical polyfill is missing from the repository.
          if [ ! -f includes/compat-php74.php ]; then
            echo "::error::Missing includes/compat-php74.php required by PHP 7.4 compatibility contract."
            exit 1
          fi
          echo "PHP 7.4 compat: PASS"

      - name: R-GW-8 anti-pattern grep guards
        run: |
          set -euo pipefail
          # Client code MUST NOT reference server-only Router_* classes.
          # Use PHP tokens so comments/docblocks and embedded JS are ignored.
          router_status=0
          while IFS= read -r -d '' file; do
            if ! php -r '
              $file = $argv[1];
              $tokens = token_get_all( file_get_contents( $file ) );
              for ( $i = 0, $n = count( $tokens ); $i < $n; $i++ ) {
                $token = $tokens[ $i ];
                if ( ! is_array( $token ) || $token[0] !== T_STRING || ! preg_match( "/^BizCity_Router_(Proxy|Auth|Usage|Models)$/", $token[1] ) ) { continue; }
                printf( "%s:%d: %s reference detected\n", $file, $token[2], $token[1] );
                exit( 1 );
              }
            ' "$file"; then
              router_status=1
            fi
          done < <(
            find core modules plugins \
              -type f -name '*.php' \
              ! -path '*/_archived/*' \
              ! -path '*/_library/*' \
              -print0
          )
          if [ "$router_status" -ne 0 ]; then
            echo "::error::R-GW-8 violation: client code references BizCity_Router_* directly (must use BizCity_LLM_Client)."
            exit 1
          fi
          # No leak of provider key option
          BAD2=$(grep -rn --include='*.php' "bizcity_openrouter_api_key" core modules plugins | grep -v 'docs/' | grep -v 'changelog' || true)
          if [ -n "$BAD2" ]; then
            echo "::warning::Provider key option referenced on client (should be server-only)."
            echo "$BAD2"
          fi
          echo "R-GW-8: PASS"

  schema-changelog:
    name: Diagnostics schema changelog (R-DCL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, json
      - name: Validate JSON changelog
        run: php core/diagnostics/validate-schema-changelog.php

  diagnostics-mock:
    name: Diagnostics CLI runner (mock mode)
    runs-on: ubuntu-latest
    needs: [lint-php]
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1']
        wp: ['6.4', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          path: wp-content/plugins/bizcity-twin-ai

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, curl, mysqli, mysql
          tools: composer:v2, wp-cli

      - name: Download WordPress
        run: |
          wp core download --path=. --version=${{ matrix.wp }}
          wp config create --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --url=http://cli.local --title=Test --admin_user=admin --admin_email=admin@example.com --admin_password=admin

      - name: Verify shipped plugin tree
        run: |
          set -euo pipefail
          provider='wp-content/plugins/bizcity-twin-ai/plugins/bizcity-profile/includes/profile/class-personal-profile-wheel-provider.php'
          if [ ! -f "$provider" ]; then
            echo "::error::Clean checkout is missing $provider"
            echo "The Profile module is required by plugins/bizcity-profile/bootstrap.php."
            exit 1
          fi
          echo "Profile provider present: $provider"

          crm_bootstrap='wp-content/plugins/bizcity-twin-ai/plugins/bizcity-twin-crm/bootstrap.php'
          if [ -f "$crm_bootstrap" ]; then
            crm_access='wp-content/plugins/bizcity-twin-ai/plugins/bizcity-twin-crm/includes/class-inbox-access.php'
            crm_legacy_access='wp-content/plugins/bizcity-twin-ai/plugins/bizcity-twin-crm/includes/inbox/class-inbox-access.php'
            if [ ! -f "$crm_access" ] && [ ! -f "$crm_legacy_access" ]; then
              echo "::warning::CRM checkout is partial; proprietary CRM will be skipped by the main loader."
              echo "Expected $crm_access or $crm_legacy_access for a complete CRM deployment."
              echo "This does not block the public framework Diagnostics matrix."
            elif grep -Eq "require_once[[:space:]]+\\\$inc[[:space:]]*\\.[[:space:]]*'inbox/class-inbox-access\\.php'" "$crm_bootstrap"; then
              echo "::error::Stale CRM bootstrap directly requires the removed Inbox Access path."
              echo "Deploy the CRM loader with its canonical/legacy readable-path fallback before running Diagnostics."
              exit 1
            else
              echo "CRM loader dependency contract present: $crm_bootstrap"
            fi
          else
            echo "CRM package absent; proprietary CRM checks are skipped."
          fi

          diagnostics_runner='wp-content/plugins/bizcity-twin-ai/bin/diagnostics-run.php'
          if [ ! -f "$diagnostics_runner" ]; then
            echo "::error::Diagnostics runner is missing: $diagnostics_runner"
            exit 1
          fi
          if ! grep -Fq 'BizCity_Site_Provisioner::run_all( true )' "$diagnostics_runner"; then
            echo "::error::Diagnostics runner lacks Site Provisioner orchestration."
            echo "The runner must provision the registered schema before executing probes."
            exit 1
          fi
          if grep -Fq 'Channel_Messages::maybe_install()' "$diagnostics_runner"; then
            echo "::error::Diagnostics runner still contains the retired direct-installer sequence."
            echo "Use BizCity_Site_Provisioner::run_all( true ) as the single schema entrypoint."
            exit 1
          fi
          echo "Diagnostics schema orchestration contract present: $diagnostics_runner"

          scheduler_manager='wp-content/plugins/bizcity-twin-ai/core/scheduler/includes/class-scheduler-manager.php'
          if [ ! -f "$scheduler_manager" ] || ! grep -Fq 'Site Provisioner may create the canonical table' "$scheduler_manager"; then
            echo "::error::Scheduler migration guard is missing from the shipped runner tree."
            echo "Canonical bizcity_crm_events must skip historical CREATE/RENAME replay."
            exit 1
          fi
          echo "Scheduler canonical migration guard present: $scheduler_manager"

      - name: Activate plugin
        run: wp plugin activate bizcity-twin-ai

      - name: Composer install
        working-directory: wp-content/plugins/bizcity-twin-ai
        run: composer install --no-dev --no-progress --prefer-dist

      - name: Run diagnostics (mock mode)
        working-directory: wp-content/plugins/bizcity-twin-ai
        env:
          BIZCITY_WP_ROOT: ${{ github.workspace }}
        run: php bin/diagnostics-run.php --skip-network --junit=build/junit.xml --filter='*'

      - name: Run framework production smoke
        run: wp --user=1 eval-file wp-content/plugins/bizcity-twin-ai/bin/framework-smoke.php

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-php${{ matrix.php }}-wp${{ matrix.wp }}
          path: wp-content/plugins/bizcity-twin-ai/build/junit.xml

      - name: Annotate test results
        if: ${{ always() && hashFiles('wp-content/plugins/bizcity-twin-ai/build/junit.xml') != '' }}
        uses: dorny/test-reporter@v1
        with:
          name: Diagnostics (PHP ${{ matrix.php }} · WP ${{ matrix.wp }})
          path: build/junit.xml
          reporter: java-junit
          working-directory: wp-content/plugins/bizcity-twin-ai
          fail-on-error: false

  docs-hooks-coverage:
    name: HOOKS.md coverage check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify new public hooks documented
        run: |
          set -e
          # Find apply_filters / do_action with bizcity_ prefix
          NEW=$(git diff origin/main...HEAD --unified=0 -- core modules plugins | \
                grep -oE "(apply_filters|do_action)\(\s*'bizcity_[a-z_]+'" | \
                sort -u || true)
          if [ -z "$NEW" ]; then
            echo "No new bizcity_* hooks in diff."
            exit 0
          fi
          for hook in $NEW; do
            name=$(echo "$hook" | grep -oE "'bizcity_[a-z_]+'")
            if ! grep -q "$name" docs/extension/HOOKS.md; then
              echo "::warning::New hook $name missing from docs/extension/HOOKS.md"
            fi
          done

  sdk-package-build:
    name: Twin UI SDK package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install SDK package dependencies
        working-directory: packages/twin-ui-sdk
        run: npm install --no-package-lock --ignore-scripts
      - name: Build SDK package
        working-directory: packages/twin-ui-sdk
        run: npm run build
      - name: Validate package contents
        working-directory: packages/twin-ui-sdk
        run: npm pack --dry-run

      - name: Validate SDK release metadata
        run: node bin/validate-sdk-release.mjs --check-build
